name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install root dependencies
        run: npm ci

      # The Lambda runtime provides the SDK clients, so they are root devDependencies.
      # `npm ci` also fails the PR if the functions lockfile is missing or out of date,
      # which matters because SAM silently falls back to `npm install` without one.
      - name: Install function dependencies
        run: cd src/functions && npm ci --ignore-scripts

      - name: Install frontend dependencies
        run: cd src/frontend && npm ci

      - name: TypeScript check (functions)
        run: npx tsc --noEmit

      # Generates .astro/types.d.ts, which declares import.meta.env.
      - name: Generate Astro types
        if: ${{ !cancelled() }}
        run: cd src/frontend && npx astro sync

      - name: TypeScript check (frontend)
        if: ${{ !cancelled() }}
        run: cd src/frontend && npx tsc --noEmit

  # No AWS access. The checkout and webhook tests create live Stripe sessions and orders,
  # so they stay manual until there is a separate test stack.
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run read-only API tests
        run: npm run test:api -- tests/api/products.test.ts
