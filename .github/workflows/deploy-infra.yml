name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'template.yaml'
      - 'src/functions/**'

  workflow_dispatch:

permissions: {}

jobs:
  # Runs third-party package code, so it must never get id-token: write.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install esbuild
        run: npm install -g esbuild@0.28.2

      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true

      - name: SAM build
        run: sam build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-build
          path: .aws-sam/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Holds AWS access: no checkout, no npm, no building.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-build
          path: .aws-sam/build

      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::411974344834:role/teesh-art-github-backend-deploy
          allowed-account-ids: '411974344834'
          aws-region: us-east-1

      # An explicit bucket instead of --resolve-s3, which needs access to SAM's bootstrap stack.
      - name: SAM deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name teesh-art \
            --region us-east-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-fxfjv4sbe6ip \
            --s3-prefix teesh-art \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "StripeSecretArn=arn:aws:secretsmanager:us-east-1:411974344834:secret:teesh-art-stripe-secrets-eanptC" \
              "SiteUrl=https://teesh-art.com"
