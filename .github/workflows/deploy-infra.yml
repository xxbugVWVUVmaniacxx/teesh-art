name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'template.yaml'
      - 'src/functions/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: |
          cd src/functions/checkout && npm ci
          cd ../webhook && npm ci
          cd ../get-products && npm ci

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name teesh-art \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "StripeSecretArn=arn:aws:secretsmanager:us-east-1:411974344834:secret:teesh-art-stripe-secrets-eanptC" \
              "StripePublishableKey=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
              "SiteUrl=https://teesh-art.com"
